<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Cake | Sweet Crumbs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg sc-navbar sticky-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">🍰 Sweet Crumbs <span>Cake Shop</span></a>
    <a href="index.html" class="btn btn-outline-secondary btn-sm">Back to Home</a>
  </div>
</nav>

<div class="container py-5">
  <div class="row g-5 align-items-center">
    <div class="col-md-6">
      <img src="assets/images/cake_6a95261f5f1ae.jpg" class="img-fluid rounded shadow" alt="Cake Preview">
    </div>
    <div class="col-md-6">
      <h2>Ube Cake</h2>
      <h3 class="text-danger my-3">₱450.00</h3>
      <p>A soft, moist cake made with real Philippine purple yam (ube), layered with cream and baked fresh.</p>
      
      <form onsubmit="event.preventDefault(); alert('🎉 Order Placed Successfully! (Static Demo)'); window.location.href='index.html';">
        <div class="mb-3">
          <label class="form-label fw-bold">Quantity</label>
          <input type="number" class="form-control" value="1" min="1" style="max-width: 100px;">
        </div>
        <div class="mb-3">
          <label class="form-label fw-bold">Delivery Address</label>
          <input type="text" class="form-control" placeholder="Enter your full Davao City address" required>
        </div>
        <button type="submit" class="sc-btn-primary w-100 py-2">Place Order Now</button>
      </form>
    </div>
  </div>
</div>

</body>
</html>
