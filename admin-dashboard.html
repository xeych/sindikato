<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Sweet Crumbs</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
  <span class="navbar-brand">🍰 Sweet Crumbs Admin Dashboard</span>
  <a href="index.html" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container">
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card p-3 shadow-sm border-0 text-center">
        <h5>Total Orders</h5>
        <h2 class="text-primary mb-0">24</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 shadow-sm border-0 text-center">
        <h5>Cake Flavors</h5>
        <h2 class="text-success mb-0">5</h2>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card p-3 shadow-sm border-0 text-center">
        <h5>Pending Deliveries</h5>
        <h2 class="text-warning mb-0">3</h2>
      </div>
    </div>
  </div>

  <div class="card p-4 shadow-sm border-0">
    <h5 class="mb-3">Recent Orders (Demo Data)</h5>
    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Cake Flavor</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>#1001</td>
            <td>John Doe</td>
            <td>Ube Cake</td>
            <td>₱450.00</td>
            <td><span class="badge bg-success">Completed</span></td>
          </tr>
          <tr>
            <td>#1002</td>
            <td>Jane Smith</td>
            <td>Chocolate Cake</td>
            <td>₱500.00</td>
            <td><span class="badge bg-warning text-dark">Pending</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

</body>
</html>
